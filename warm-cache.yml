name: Abroon Cache Warmer

# گرم‌کننده کش سایت abroonco.com
# هر ۴ ساعت همه صفحات با نمای دسکتاپ + موبایل گرم می‌شوند.
# نکته مهم: ورک‌فلو روی سرورهای خود گیت‌هاب اجرا می‌شود (نه در ایران)،
# پس به قطعی اینترنت ایران ربطی ندارد و همیشه کار می‌کند.

on:
  schedule:
    - cron: '0 */4 * * *'   # هر ۴ ساعت (UTC)
  workflow_dispatch: {}      # دکمه «Run workflow» برای تست دستی

permissions:
  contents: write            # فقط برای کامیت keepalive

concurrency:
  group: abroon-warmer
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 120     # اولین اجرا (همه سرد) حدود ۱ ساعت طول می‌کشد
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Warm cache (desktop + mobile, all pages)
        run: python3 warm_cache.py

      # گیت‌هاب ورک‌فلوهای زمان‌بندی‌شده ریپوی Public را بعد از ۶۰ روز
      # بدون فعالیت خودکار غیرفعال می‌کند؛ این مرحله هر شب یک کامیت کوچک
      # می‌زند تا گرم‌کننده برای همیشه فعال بماند — لازم به کاری نیستید.
      - name: Keepalive (prevent 60-day auto-disable)
        run: |
          if [ "$(date -u +%H)" = "00" ]; then
            git config user.name  "abroon-warmer-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            echo "last run: $(date -u '+%F %T')" > .last-run.txt
            git add .last-run.txt
            git diff --cached --quiet || (git commit -m "keepalive: $(date -u +%F)" && git push)
            echo "keepalive committed"
          else
            echo "skip (keepalive runs once a day at 00 UTC)"
          fi
